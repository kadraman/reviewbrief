name: FixBrief AI
description: AI-powered pull request reviews with any LLM, large-PR support, and fix briefs for AI coding assistants.
author: kadraman

branding:
  icon: eye
  color: purple

inputs:
  api-key:
    description: API key for your LLM provider (pass it from a repository secret).
    required: true
  model:
    description: Model name, exactly as your provider's API expects it (recommended gpt-5-mini).
    required: true
  provider:
    description: "API protocol: 'openai' (any OpenAI-compatible API) or 'anthropic'."
    required: false
    default: openai
  base-url:
    description: Optional API root override (e.g. https://api.deepseek.com). Leave blank for OpenAI.
    required: false
    default: ""
  temperature:
    description: Sampling temperature (default 0). Set to 'none' to omit the parameter (recommended for gpt-5*).
    required: false
    default: ""
  consistency-runs:
    description: Independent review passes for agreement scoring (1-5, default 2). Extra runs use CONSISTENCY_TEMPERATURE. Agreement adjusts confidence; critical/high that clear the floor still publish as one-offs. One-off medium findings stay out of the fix brief.
    required: false
    default: "2"
  max-output-tokens:
    description: Max output tokens per call (required by the Anthropic API).
    required: false
    default: "8192"
  batch-chars:
    description: Maximum diff characters packed per API call.
    required: false
    default: "100000"
  piece-chars:
    description: Max characters per file piece before hunk-splitting (keeps large files from failing as one batch). Default 20000.
    required: false
    default: "20000"
  max-batches:
    description: Cost guard. Batches beyond this are listed as not reviewed.
    required: false
    default: "40"
  workers:
    description: Number of parallel API calls.
    required: false
    default: "3"
  minimum-confidence:
    description: Confidence floor for published findings (0..1). Only severity critical or high at or above this floor appear on the PR (medium/low/info stay in the job summary).
    required: false
    default: "0.85"
  max-inline-comments:
    description: Optional cap on inline review comments; 0 means no cap.
    required: false
    default: "0"
  fix-brief:
    description: "'true' to also produce fix-brief.md for an AI coding assistant."
    required: false
    default: "true"
  post-comment:
    description: "'true' to post the review as a PR comment."
    required: false
    default: "true"
  github-token:
    description: Token used to post the comment (needs pull-requests write).
    required: false
    default: ${{ github.token }}
  diff-context-lines:
    description: Lines of context around each change in the diff the model reads (GitHub's own diff has 3).
    required: false
    default: "10"
  context-chars:
    description: Cap for the reference context added to each review call. 0 turns it off.
    required: false
    default: "12000"
  debug-artifacts:
    description: "true to upload findings.json and review-payload.json (they contain code excerpts)."
    required: false
    default: "false"

outputs:
  review-path:
    description: Path to the generated review.md.
    value: ${{ steps.review.outputs.review_path }}
  fix-brief-path:
    description: Path to fix-brief.md (empty if there was nothing actionable).
    value: ${{ steps.review.outputs.brief_path }}
  fix-brief-url:
    description: Download URL of the uploaded fix-brief artifact.
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Compute diffs
      id: diffs
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        OUT_DIR: ${{ runner.temp }}/fixbrief-ai
        BASE_REF: ${{ github.base_ref }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BEFORE_SHA: ${{ github.event.before }}
        PR_ACTION: ${{ github.event.action }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        DIFF_CONTEXT_LINES: ${{ inputs.diff-context-lines }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        if [ -z "${BASE_REF:-}" ]; then
          echo "::error::fixbrief-ai must run on a pull_request event."
          exit 1
        fi
        bash "$ACTION_PATH/scripts/compute-diffs.sh"

    - name: Set up Node.js for the TypeScript renderer
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Run review
      id: review
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        LLM_API_KEY: ${{ inputs.api-key }}
        LLM_MODEL: ${{ inputs.model }}
        LLM_PROVIDER: ${{ inputs.provider }}
        LLM_BASE_URL: ${{ inputs.base-url }}
        LLM_TEMPERATURE: ${{ inputs.temperature }}
        CONSISTENCY_RUNS: ${{ inputs.consistency-runs }}
        LLM_MAX_OUTPUT_TOKENS: ${{ inputs.max-output-tokens }}
        BATCH_CHARS: ${{ inputs.batch-chars }}
        PIECE_CHARS: ${{ inputs.piece-chars }}
        MAX_BATCHES: ${{ inputs.max-batches }}
        WORKERS: ${{ inputs.workers }}
        MINIMUM_CONFIDENCE: ${{ inputs.minimum-confidence }}
        MAX_INLINE_COMMENTS: ${{ inputs.max-inline-comments }}
        FIX_BRIEF: ${{ inputs.fix-brief }}
        ANCHOR_DIFF_FILE: ${{ runner.temp }}/fixbrief-ai/anchor.diff
        CONTEXT_CHARS: ${{ inputs.context-chars }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD: ${{ github.head_ref }}
        PR_BASE: ${{ github.base_ref }}
        REPO: ${{ github.repository }}
        BEFORE_SHA: ${{ github.event.before }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/fixbrief-ai"
        scope="$(cat "$out/scope.txt" 2>/dev/null || echo full)"
        if [ "$scope" = "incremental" ] && [ -n "${BEFORE_SHA:-}" ]; then
          SHORT="$(git rev-parse --short "$BEFORE_SHA" 2>/dev/null || echo "${BEFORE_SHA:0:7}")"
          export REVIEW_SCOPE="Reviewed changes since ${SHORT} (incremental push), not the full pull request."
        else
          export REVIEW_SCOPE="Reviewed the full pull request diff against origin/${BASE_REF}."
        fi
        node --experimental-strip-types "$ACTION_PATH/src/fixbrief-ai.ts" --diff "$out/pr.diff" --out-dir "$out"
        echo "review_path=$out/review.md" >> "$GITHUB_OUTPUT"
        if [ -f "$out/fix-brief.md" ]; then
          echo "has_brief=true" >> "$GITHUB_OUTPUT"
          echo "brief_path=$out/fix-brief.md" >> "$GITHUB_OUTPUT"
        fi
        echo "review_payload_path=$out/review-payload.json" >> "$GITHUB_OUTPUT"

    - name: Post review comment
      id: post
      if: inputs.post-comment == 'true' && github.event.pull_request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_ACTION: ${{ github.event.action }}
        REVIEW_PAYLOAD: ${{ steps.review.outputs.review_payload_path }}
        REPO: ${{ github.repository }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        OUT="$RUNNER_TEMP/fixbrief-ai"
        POSTED=false
        REVIEW_ID=""
        echo "[]" > "$OUT/posted-comments.json"
        save_comments() {
          local id="$1"
          if [ -z "$id" ]; then echo "[]" > "$OUT/posted-comments.json"; return; fi
          if RAW="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews/$id/comments")"; then
            printf '%s' "$RAW" | node --input-type=module -e '
              import { readFileSync, writeFileSync } from "node:fs";
              const raw = readFileSync(0, "utf8").trim();
              let rows = [];
              try { rows = JSON.parse(raw || "[]"); } catch { rows = []; }
              if (!Array.isArray(rows)) rows = [];
              writeFileSync(process.argv[1], JSON.stringify(rows.map((c) => ({
                id: c.id, body: c.body || "", path: c.path, line: c.line ?? null,
              })), null, 2));
            ' "$OUT/posted-comments.json"
          else
            echo "[]" > "$OUT/posted-comments.json"
          fi
        }
        # Decide whether the gated payload has anything worth posting.
        HAS_CONTENT="$(node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const payload = JSON.parse(readFileSync(process.argv[1], "utf8"));
          const has = payload.comments.length > 0
            || /### Could not place inline|### Over the inline cap/.test(payload.body || "");
          console.log(has ? "yes" : "no");
        ' "$REVIEW_PAYLOAD")"
        INLINE_COUNT="$(node --input-type=module -e '
          import { readFileSync } from "node:fs";
          console.log(JSON.parse(readFileSync(process.argv[1], "utf8")).comments.length);
        ' "$REVIEW_PAYLOAD")"
        if [ "$HAS_CONTENT" != "yes" ]; then
          if [ "${PR_ACTION:-}" = "synchronize" ]; then
            echo "Nothing met the publish gate on this push; leaving the earlier review in place."
          else
            # opened / reopened: post the gated overview so the first run is visible.
            if REVIEW_JSON="$(gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/reviews" --input "$REVIEW_PAYLOAD")"; then
              REVIEW_ID="$(printf '%s' "$REVIEW_JSON" | node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync(0,"utf8")).id || "")')"
              POSTED=true
              echo "Posted empty-gate PR review (no inline findings)."
              save_comments "$REVIEW_ID"
            else
              node --input-type=module -e '
                import { readFileSync, writeFileSync } from "node:fs";
                const payload = JSON.parse(readFileSync(process.argv[1], "utf8"));
                writeFileSync(process.argv[2], payload.body);
              ' "$REVIEW_PAYLOAD" "$OUT/comment.md"
              gh pr comment "$PR_NUMBER" --body-file "$OUT/comment.md"
              echo "Posted empty-gate summary comment."
            fi
          fi
        else
          # Prefer a single PR review (overview + inline threads). Fall back to the
          # gated payload body (never review.md) if create-review fails.
          if REVIEW_JSON="$(gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/reviews" --input "$REVIEW_PAYLOAD")"; then
            REVIEW_ID="$(printf '%s' "$REVIEW_JSON" | node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync(0,"utf8")).id || "")')"
            POSTED=true
            echo "Posted PR review with $INLINE_COUNT inline comment(s)."
            save_comments "$REVIEW_ID"
          else
            echo "::warning::create-review failed; posting gated payload as an issue comment."
            node --input-type=module -e '
              import { readFileSync, writeFileSync } from "node:fs";
              const payload = JSON.parse(readFileSync(process.argv[1], "utf8"));
              const parts = [payload.body.trimEnd()];
              for (const c of payload.comments || []) {
                parts.push("", `---`, "", `**\`${c.path}:${c.line}\`**`, "", c.body);
              }
              writeFileSync(process.argv[2], parts.join("\n") + "\n");
            ' "$REVIEW_PAYLOAD" "$OUT/comment.md"
            gh pr comment "$PR_NUMBER" --body-file "$OUT/comment.md"
            echo "Posted gated summary comment with $INLINE_COUNT finding(s)."
          fi
        fi
        echo "posted=$POSTED" >> "$GITHUB_OUTPUT"
        echo "review_id=$REVIEW_ID" >> "$GITHUB_OUTPUT"

    - name: Attach fix-brief report-back
      if: steps.review.outputs.has_brief == 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BRIEF_PATH: ${{ steps.review.outputs.brief_path }}
      run: |
        set -euo pipefail
        OUT="$RUNNER_TEMP/fixbrief-ai"
        TARGETS="$OUT/fix-brief-targets.json"
        COMMENTS="$OUT/posted-comments.json"
        if [ ! -f "$COMMENTS" ]; then echo "[]" > "$COMMENTS"; fi
        if [ ! -f "$TARGETS" ]; then
          echo "No fix-brief-targets.json; skipping report-back attach."
          exit 0
        fi
        node --experimental-strip-types "$ACTION_PATH/src/attach-replies.ts" \
          --brief "$BRIEF_PATH" --targets "$TARGETS" --comments "$COMMENTS"

    - name: Upload fix brief
      id: upload
      if: steps.review.outputs.has_brief == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: fix-brief-pr-${{ github.event.pull_request.number }}
        path: ${{ steps.review.outputs.brief_path }}
        retention-days: 14

    - name: Link fix brief on review
      if: steps.review.outputs.has_brief == 'true' && steps.post.outputs.posted == 'true' && steps.post.outputs.review_id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        REVIEW_ID: ${{ steps.post.outputs.review_id }}
        REVIEW_PAYLOAD: ${{ steps.review.outputs.review_payload_path }}
        BRIEF_URL: ${{ steps.upload.outputs.artifact-url }}
      run: |
        set -euo pipefail
        if [ -z "${BRIEF_URL:-}" ]; then
          echo "No artifact URL; skipping review body patch."
          exit 0
        fi
        PATCH="$RUNNER_TEMP/fixbrief-ai/review-body-patch.json"
        node --input-type=module -e '
          import { readFileSync, writeFileSync } from "node:fs";
          const payload = JSON.parse(readFileSync(process.argv[1], "utf8"));
          const url = process.argv[2];
          const line = `**Fix brief for an AI assistant:** [download fix-brief.md](${url})`;
          const body = `${payload.body.trimEnd()}\n\n${line}\n`;
          writeFileSync(process.argv[3], JSON.stringify({ body }));
        ' "$REVIEW_PAYLOAD" "$BRIEF_URL" "$PATCH"
        gh api --method PUT "repos/$REPO/pulls/$PR_NUMBER/reviews/$REVIEW_ID" --input "$PATCH" >/dev/null
        echo "Patched review $REVIEW_ID with fix-brief download link."

    - name: Upload debug artifacts
      if: always() && inputs.debug-artifacts == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: fixbrief-ai-debug-pr-${{ github.event.pull_request.number }}
        path: |
          ${{ runner.temp }}/fixbrief-ai/findings.json
          ${{ runner.temp }}/fixbrief-ai/review-payload.json
          ${{ runner.temp }}/fixbrief-ai/fix-brief-targets.json
          ${{ runner.temp }}/fixbrief-ai/scope.txt
        retention-days: 7
        if-no-files-found: ignore
